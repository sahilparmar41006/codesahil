<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="success.html" method="post" enctype="multipart/form-data">
        <table border="1" cellpadding="10" align="center" width="50%">
            <tr>
                <th bgcolor="yellow">compose email</th>
            </tr>
            <tr>
                <td>
                    <input type="email" name="email" id="email" placeholder="enter your email address" required/>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="text" name="subject" id="subject" required placeholder="enter mail subject">
                </td>
            </tr>
            <tr>
                <td bgcolor="#eeeeee">Attachment</td>
            </tr>
            <tr>
                <td>
                    <input type="file" name="Attachment" id="Attachment"
                    multiple accept=".doc,.docx,.xls,.xlsx,.ppt,.pptx,.pdf">
                <!----dont forget to seet enctype in form tag-------->
                </td>
            </tr>
            <tr>
                <td>
                    <textarea name="address" id="addresss" required
                    placeholder="your address"></textarea>
                </td>
            </tr>
            <tr>
                <td align="center">
                    <button type="submit">send email</button>
                    <button type="reset">clear all</button>
                    <button type="button"> i can't do anything</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
