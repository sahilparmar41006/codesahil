<html>
        <head>
            <title>email compose</title>
        </head>
        <body>
            <form action="success.html">
                <table border="1" cellpadding="10" align="center" width="50%">
                    <tr>
                        <th bgcolor="yellow">compose email</th>
                    </tr>
                    <tr>
                        <td bgcolor="#eeeeee">email</td>
                    </tr>
                    <tr>
                        <td>
                            <input type="email" name="email" id="email" required/>
                        </td>
                    </tr>
                    <tr>
                        <td bgcolor="#eeeeee">subject</td>
                    </tr>
                    <tr>
                        <td>
                            <input type="text" name="subject" id="subject" required/>
                        </td>
                    </tr>
                    <tr>
                        <td bgcolor="#eeeeee">
                            attachment
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="file" name="attachment" id="attachment">
                        </td>
                    </tr>
                    <tr>
                        <td bgcolor="#eeeeee">Address</td>
                    </tr>
                    <tr>
                        <td>
                            <textarea name="address" id="address" required rows="10" cols="50"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td align="center">
                            <button type="submit">send email</button>
                            <button type="reset">clear all</button>
                            <button type="button">i can do anything</button>
                        </td>
                    </tr>
                </table>
            </form>
        </body>
</html>
