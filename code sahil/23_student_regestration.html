<html>
    <head>
        <title>student registration form</title>
    </head>
    <body>
        <h1 align="center">student registration form</h1>
        <form>
            <fieldset>
                <b>personal information</b><br>
                <label>fullname:</label><br>
                <input type="text" name="name" placeholder="enter your name">
                <br>
                <br>
                <label >email:</label><br>
                <input type="email" name="email" placeholder="enter your email">
                <br>
                <br><label >passsword:</label>
                <br>
                <input type="password" name="password">
                <br><br>
                <label>dob:</label>
                <br>
                <input type="date" name="dob">
                <br><br>
                <label >gender</label>
                <input type="radio" name="gender" value="male">male
              
                <input type="radio" name="gender" value="female">female

                <input type="radio" name="gender" value="transgender"> transgender
            </fieldset>
            <br>
            <fieldset>
                <b> course information</b><br><br>
                <label >select course:</label>
                <select name="course">
                    <option>select course</option>
                    <option>html&css</option>
                    <option>javascript</option>
                    <option>python</option>
                    <option>reactjs</option>
                </select>
                <br><br>
                <label>skills:</label>
                <input type="checkbox" name="skill">html
                <input type="checkbox" name="skill">css
                <input type="checkbox" name="skill">javascript
                <input type="checkbox" name="skill">python
                <br><br>
                <label >Address:</label>
                <br>
                <textarea rows="5" cols="40" placeholder="enter your address"></textarea>
            </fieldset>
            <br>
            <input type="submit" value="register">
            <input type="reset" value="clear">
        </form>
    </body>
</html>
