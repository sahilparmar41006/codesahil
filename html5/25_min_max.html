<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <table border="1" cellpadding="10" width="100%" bgcolor="#eeeee">
            <tr>
                <td>
                    <label for="source">source</label>
                    <input type="text" name="source" id="source" required>
                </td>
                <td>
                    <label for="destination">destination</label>
                    <input type="text" name="destination" id="destination" required>
                </td>
                <td>
                    <label for="journeydate">date</label>
                    <input type="date" name="journeydate" id="journeydate"
                    required min="2026-07-26" max="2026-8-25">
                </td>
                <td>
                    <label for="seats">seats</label>
                    <input type="number" name="seats" id="seats" required min="1" max="6">
                </td>
                <td>
                    <label for="">bus type</label>
                    <label for="express">
                        <input type="checkbox" name="express" id="express" value="1">express
                    </label>
                    <label for="ac">
                        <input type="checkbox" name="aac" id="ac" value="2">ac
                    </label>
                    <label for="volvo">
                        <input type="checkbox" name="volvo" id="volvo" value="3">volvo
                    </label>
                    <label for="sleeper">
                        <input type="checkbox" name="sleeper" id="sleeper" value="4">sleeper
                    </label>
                </td>
                <td>
                    <label for="">select gender</label>
                    <label for="male">
                        <input type="radio" name="gender" id="male">male
                    </label>
                    <label for="female">
                        <input type="radio" name="gender" id="female">female
                    </label>
                </td>
                <td>
                    <input type="submit" value="search">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
